[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoprel"
version = "0.1.0"
description = "Shopping ads relevance: predict human relevance ratings for query-product ad pairs and use them in retrieval, ad eligibility, ranking and auction pricing. Built on Amazon ESCI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
neural = ["sentence-transformers>=2.6", "torch>=2.1"]
llm = ["anthropic>=1.0"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
shoprel = "shoprel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E402"]
